apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: minio
    targetRevision: 14.10.2
    helm:
      values: |
        mode: standalone
        auth:
          rootUser: minioadmin
          rootPassword: minioadmin
        defaultBuckets: "mlflow-artifacts"
        persistence:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: minio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
