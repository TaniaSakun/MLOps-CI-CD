apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aiops-quality
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/TaniaSakun/MLOps-CI-CD.git
    targetRevision: lesson-10
    path: aiops-quality-project/helm

  destination:
    server: https://kubernetes.default.svc
    namespace: aiops-quality

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

