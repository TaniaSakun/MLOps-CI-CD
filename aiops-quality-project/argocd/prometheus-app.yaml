apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus
      targetRevision: 25.21.0
      helm:
        values: |
          server:
            persistentVolume:
              enabled: false

            extraScrapeConfigs:
              enabled: true
              external:
                name: additional-scrape-configs
                key: additionalScrapeConfigs.yaml

          pushgateway:
            enabled: true

    - repoURL: https://github.com/TaniaSakun/MLOps-CI-CD.git
      targetRevision: final-project
      path: prometheus
